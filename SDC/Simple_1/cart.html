<!doctype html>
<html>
  <head>
    <title>Shopping Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="container">
    <h1 class="text-center bg-light p-3">Shopping Cart</h1>

    <nav class="text-center p-2">
      <a href="cart.html" class="btn btn-secondary">Home</a>
      <a href="login.html" class="btn btn-secondary">Login</a>
      <a href="register.html" class="btn btn-secondary">Register</a>
    </nav>

    <h2>Products</h2>

    <div class="row">
      <div class="col-12 col-md-6 p-2">
        Product 1 - Rs. 100
        <button class="btn btn-primary" onclick="add(100)">Add</button>
      </div>

      <div class="col-12 col-md-6 p-2">
        Product 2 - Rs. 200
        <button class="btn btn-primary" onclick="add(200)">Add</button>
      </div>
    </div>

    <div class="box">
      <h2>Your Cart</h2>

      <div id="cart">Cart is empty</div>

      <h4 id="total">Total: Rs. 0</h4>

      <button class="btn btn-success" onclick="order()">Place Order</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
